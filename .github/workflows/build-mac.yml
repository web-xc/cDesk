name: Build macOS DMG

on:
  workflow_dispatch:
  release:
    types: [created]

jobs:
  dmg:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build electron-vite
        run: npm run build

      - name: Build universal DMG
        run: npx electron-builder --mac dmg --universal

      - uses: actions/upload-artifact@v4
        with:
          name: cDesk-macos-dmg
          path: release/*.dmg
          if-no-files-found: error
