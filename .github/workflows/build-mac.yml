name: Build macOS DMG

on:
  workflow_dispatch:
  release:
    types: [created]

jobs:
  dmg:
    name: DMG (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Intel 构建机：避免 macOS arm64 runner 排队过久
          - runner: macos-15-intel
            arch: x64
          - runner: macos-15
            arch: arm64
    runs-on: ${{ matrix.runner }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: false
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build renderer + main
        run: npm run build

      - name: Package DMG
        run: npx electron-builder --mac dmg --${{ matrix.arch }}

      - uses: actions/upload-artifact@v4
        with:
          name: cDesk-macos-dmg-${{ matrix.arch }}
          path: release/*.dmg
          if-no-files-found: error
