name: Build macOS DMG

on:
  workflow_dispatch:

jobs:
  dmg:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build universal .app
        run: |
          npm run build
          npx electron-builder --mac --universal --dir

      - name: Package DMG with appdmg
        run: |
          VERSION=$(node -p "require('./package.json').version")
          npx appdmg build/dmg.json "release/cDesk-${VERSION}.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: cDesk-macos-dmg
          path: release/*.dmg
          if-no-files-found: error
